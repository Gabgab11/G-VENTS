# Local Supabase settings. Used by `supabase start` and by CI to prove that
# every migration in migrations/ applies cleanly, in order, to an empty
# database. Unlisted settings use the CLI's defaults.
project_id = "g-vents"

[auth]
# Asymmetric (ES256) access tokens, as in production (O17); gventz-api accepts only ES256/RS256.
# The key file is local and gitignored: create it with `node supabase/scripts/gen-signing-key.mjs`.
signing_keys_path = "./signing_keys.json"
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Two-step sign-in with an authenticator app (D54): required for G-ventZ staff (admin dashboard),
# optional for everyone else. Hosted projects have TOTP on by default; set it here for local runs.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Passkeys (WebAuthn) as the second step, for staff and anyone who wants them. Hosted projects:
# turn on WebAuthn under Authentication > Multi-Factor in the Supabase dashboard.
[auth.mfa.web_authn]
enroll_enabled = true
verify_enabled = true

# Who passkeys belong to: this site's domain and page origin. Hosted projects: set the same under
# Authentication (gventz.com and https://gventz.com; staging.gventz.com for staging).
[auth.webauthn]
rp_display_name = "G-ventZ"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]

# Local emails carry the 6-digit code the sign-in page asks for (production uses the same template, O17).
[auth.email.template.magic_link]
subject = "Your G-ventZ sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

# A new account's first code comes from the "Confirm signup" template, not "Magic link". It must
# carry {{ .Token }} too, or sign-up emails a link and the code screen waits forever. Production:
# set both templates in the Supabase dashboard (Authentication > Emails).
[auth.email.template.confirmation]
subject = "Your G-ventZ sign-up code"
content_path = "./supabase/templates/sign-up-code.html"

# Bot protection on sign-in code requests (FR-1.7). Off locally; to try it, set enabled = true
# with Cloudflare's always-pass test keys (secret 1x0000000000000000000000000000000AA, site key
# 1x00000000000000000000AA in NEXT_PUBLIC_TURNSTILE_SITE_KEY). Production: Supabase dashboard.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "1x0000000000000000000000000000000AA"

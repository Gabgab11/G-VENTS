name: Build and deploy the website to Cloudflare Workers
description: >
  Builds the site with OpenNext for one wrangler.jsonc environment and deploys it.
  Used only by deploy.yml, inside a job bound to the matching GitHub environment.
  The calling step passes, through `env:`, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
  the public NEXT_PUBLIC_* settings (environment variables) and the Worker secrets
  BFF_SHARED_SECRET, REVALIDATE_SECRET and optional MAINTENANCE_BYPASS (environment secrets).

inputs:
  environment:
    description: wrangler.jsonc environment (staging or production)
    required: true

outputs:
  url:
    description: The workers.dev (or custom domain) address of the new deployment
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    # Public settings come from wrangler.jsonc, the same values the Worker runs with, because
    # Next.js inlines NEXT_PUBLIC_* into the browser bundle at build time.
    - name: Settings for ${{ inputs.environment }}
      shell: bash
      env:
        TARGET: ${{ inputs.environment }}
      run: |
        [[ "$TARGET" =~ ^(staging|production)$ ]] || { echo "::error::Unknown environment '$TARGET'."; exit 1; }
        node scripts/cloudflare/wrangler-vars.mjs "$TARGET" | tee -a "$GITHUB_ENV"
        missing=()
        for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY BFF_SHARED_SECRET REVALIDATE_SECRET; do
          [ -n "${!name:-}" ] || missing+=("$name")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing in the GitHub environment for $TARGET: ${missing[*]} (docs/deploy-cloudflare.md, Settings)."; exit 1
        fi

    - name: Build (Next.js + OpenNext)
      shell: bash
      run: npm run cf:build

    # Pages pre-rendered at build time go into this environment's R2 cache before the new
    # version goes live, so the first requests don't render them again.
    - name: Fill the page cache
      shell: bash
      env:
        TARGET: ${{ inputs.environment }}
      run: npx opennextjs-cloudflare populateCache remote --env "$TARGET"

    - name: Deploy
      id: deploy
      shell: bash
      env:
        TARGET: ${{ inputs.environment }}
        OPEN_NEXT_DEPLOY: "true" # tells wrangler not to hand the deploy back to OpenNext
        WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
      run: |
        # Secrets go to Cloudflare with this version (never on the command line or in the log);
        # the file lives in the runner's temp directory and is deleted straight after.
        secrets="$RUNNER_TEMP/worker-secrets.json"
        trap 'rm -f "$secrets"' EXIT
        (umask 077; jq -n 'env | with_entries(select(.key | IN("BFF_SHARED_SECRET","REVALIDATE_SECRET","MAINTENANCE_BYPASS")) | select(.value != ""))' > "$secrets")
        npx wrangler deploy --env "$TARGET" \
          --secrets-file "$secrets" \
          --var "MAINTENANCE_MODE:${MAINTENANCE_MODE:-0}" \
          --tag "${GITHUB_SHA:0:12}" \
          --message "${GITHUB_REPOSITORY}@${GITHUB_SHA:0:12} run ${GITHUB_RUN_ID}"
        url=$(jq -r 'select(.type == "deploy") | .targets[]?' "$WRANGLER_OUTPUT_FILE_PATH" | grep -E '^https://' | head -1)
        [ -n "$url" ] || { echo "::error::wrangler did not report a deployment URL."; exit 1; }
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "### Deployed \`${GITHUB_SHA:0:7}\` to $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"

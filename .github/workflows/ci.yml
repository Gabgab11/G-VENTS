name: CI

# Pull requests run it directly. Pushes to staging and main run it through deploy.yml
# (workflow_call), so every deployment is gated on CI for exactly the commit it ships.
on:
  pull_request:
  workflow_call:
    # A called workflow gets no secrets unless the caller passes them (deploy.yml does).
    secrets:
      GVENTZ_API_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces the older run; deploy runs are never cancelled.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No Supabase variables on purpose: the build must not need secrets. Real keys live in the
    # repository's STAGING_* / PRODUCTION_* settings (deploy.yml) and in Vercel.
    env:
      NEXT_PUBLIC_SITE_URL: https://staging.gventz.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API contract the website is built against: api-contract.ref names a gventz-api commit
      # SHA or release tag (vX.Y.Z). Fails when src/lib/api/schema.d.ts wasn't regenerated from
      # exactly that contract (npm run api:types:pinned), so the two repos can't drift silently.
      - name: API types match the pinned gventz-api contract
        env:
          # gventz-api is private: a fine-grained token with Contents: read on that repo only.
          GVENTZ_API_READ_TOKEN: ${{ secrets.GVENTZ_API_READ_TOKEN }}
        run: |
          ref=$(tr -d '[:space:]' < api-contract.ref)
          [[ "$ref" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error file=api-contract.ref::Must be a full gventz-api commit SHA or a vX.Y.Z tag, not '$ref'."; exit 1; }
          cp src/lib/api/schema.d.ts "$RUNNER_TEMP/committed.d.ts"
          npm run -s api:types:pinned
          diff -u "$RUNNER_TEMP/committed.d.ts" src/lib/api/schema.d.ts || { echo "::error file=src/lib/api/schema.d.ts::Out of date with gventz-api@$ref. Run npm run api:types:pinned and commit it."; exit 1; }
      - name: Release scripts
        run: node --test .github/scripts/check-api-contract.test.mjs .github/scripts/workflow-secrets.test.mjs scripts/cloudflare/wrangler-vars.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The Cloudflare Workers bundle (OpenNext): runs `next build` and then bundles the Worker,
      # so it is also the plain Next.js build check. The dry runs validate wrangler.jsonc and
      # every binding for both environments without uploading anything or needing a token.
      - name: Build (Next.js + Cloudflare Worker)
        run: npm run cf:build
      - name: Worker config is valid for staging and production
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          for target in staging production; do
            npx wrangler deploy --dry-run --env "$target" --outdir "$RUNNER_TEMP/dry-run-$target" >/dev/null
            echo "$target: ok"
          done

  # Applies every migration, in order, to a throwaway local Supabase database,
  # then lints the schema and runs the database tests. Catches a migration that would fail on staging or
  # production before it is merged. Never touches the real databases.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0 # pinned: generated types must match byte for byte
      - run: node supabase/scripts/gen-signing-key.mjs
      - run: supabase db start
      - run: supabase db lint --local --level error --fail-on error
      - run: supabase test db # supabase/tests/*.test.sql (pgTAP)
      # Fails when a migration changed the schema but database.types.ts wasn't
      # regenerated (npm run db:types:local) and committed.
      - name: Database types are up to date
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No Supabase variables on purpose: the build must not need secrets, so a
    # Vercel environment without them still deploys. Real keys live in Vercel.
    env:
      NEXT_PUBLIC_SITE_URL: https://g-vents.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API contract the website is built against: api-contract.ref names a gventz-api commit
      # SHA or release tag (vX.Y.Z). Fails when src/lib/api/schema.d.ts wasn't regenerated from
      # exactly that contract (npm run api:types:pinned), so the two repos can't drift silently.
      - name: API types match the pinned gventz-api contract
        run: |
          ref=$(tr -d '[:space:]' < api-contract.ref)
          [[ "$ref" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error file=api-contract.ref::Must be a full gventz-api commit SHA or a vX.Y.Z tag, not '$ref'."; exit 1; }
          cp src/lib/api/schema.d.ts "$RUNNER_TEMP/committed.d.ts"
          npm run -s api:types:pinned
          diff -u "$RUNNER_TEMP/committed.d.ts" src/lib/api/schema.d.ts || { echo "::error file=src/lib/api/schema.d.ts::Out of date with gventz-api@$ref. Run npm run api:types:pinned and commit it."; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Applies every migration, in order, to a throwaway local Supabase database,
  # then lints the schema and runs the database tests. Catches a migration that would fail on staging or
  # production before it is merged. Never touches the real databases.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0 # pinned: generated types must match byte for byte
      - run: node supabase/scripts/gen-signing-key.mjs
      - run: supabase db start
      - run: supabase db lint --local --level error --fail-on error
      - run: supabase test db # supabase/tests/*.test.sql (pgTAP)
      # Fails when a migration changed the schema but database.types.ts wasn't
      # regenerated (npm run db:types:local) and committed.
      - name: Database types are up to date
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

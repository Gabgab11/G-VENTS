name: Database migrations

# Applies supabase/migrations/ to the live databases.
#   staging:    automatically on every push to the `staging` branch that changes a migration.
#   production: only when started by hand (Actions → Database migrations → Run workflow),
#               from the `staging` or `main` branch, with the confirmation typed in.
#               Run it before merging `staging` into `main`, so the database is ready
#               before Vercel deploys the code that needs it.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN        personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_STAGING_REF         project ref of gvents-staging
#   SUPABASE_STAGING_DB_PASSWORD database password of gvents-staging
#   SUPABASE_PROD_REF            project ref of gvents-prod
#   SUPABASE_PROD_DB_PASSWORD    database password of gvents-prod

on:
  push:
    branches: [staging]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "Database to migrate"
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'For production, type "apply to production"'
        required: false

# One migration run per database at a time; never cancel one halfway.
concurrency:
  group: migrate-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ github.event.inputs.target || 'staging' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the request
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ "$CONFIRM" != "apply to production" ]; then
              echo "::error::Type \"apply to production\" in the confirm box to migrate production."; exit 1
            fi
            if [ "$REF_NAME" != "staging" ] && [ "$REF_NAME" != "main" ]; then
              echo "::error::Production is migrated only from the staging or main branch (got $REF_NAME)."; exit 1
            fi
          fi

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Link the ${{ env.TARGET }} project
        env:
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
          STAGING_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          PROD_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          if [ "$TARGET" = "production" ]; then REF="$PROD_REF"; PASSWORD="$PROD_PASSWORD"; else REF="$STAGING_REF"; PASSWORD="$STAGING_PASSWORD"; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Missing Supabase secrets for $TARGET. See the top of this workflow."; exit 1
          fi
          echo "SUPABASE_DB_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          supabase link --project-ref "$REF" --password "$PASSWORD"

      - name: Migrations before
        run: supabase migration list --linked

      # --dry-run first, so the log shows exactly what is about to run.
      - name: Apply new migrations
        run: |
          supabase db push --linked --dry-run
          supabase db push --linked

      - name: Migrations after
        run: supabase migration list --linked

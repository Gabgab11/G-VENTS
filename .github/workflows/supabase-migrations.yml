name: Supabase migrations

# Applies supabase/migrations to the real projects. Pull-request checks (apply to a throwaway
# database, lint, pgTAP, generated types) stay in ci.yml.
#   staging:    automatically on push to feature/backend-split or main when a migration changes
#   production: manual run with input "production"; the GitHub environment requires one approver.
# Order rule: run production BEFORE releasing an API version that needs the change.

on:
  push:
    branches: [main, feature/backend-split]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Project to migrate'
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: supabase-migrations-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
